[tool.poetry]
name = "opensesame-plugin-experiment_manager"
version = "4.0.6"
description = "OpenSesame plugin for running other OpenSesame experiments within an experiment"
authors = ["Bob Rosbag <mail@bobrosbag.nl>"]
readme = "README.md"
packages = [
    {include = "opensesame_plugins"},
]
license = "GPL-3.0-or-later"
homepage = "https://github.com/dev-jam/opensesame-plugin-experiment_manager"
repository = "https://github.com/dev-jam/opensesame-plugin-experiment_manager"

[tool.poetry.dependencies]
python = ">= 3.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
